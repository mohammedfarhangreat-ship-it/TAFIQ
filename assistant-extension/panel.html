<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tafiq</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    header h1 { font-size: 17px; margin: 0; flex: 1; }
    header button { padding: 4px 12px; font-size: 13px; }
    .log { flex: 1; overflow-y: auto; padding: 16px; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--surface); }
    form input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; background: var(--bg); }
  </style>
</head>
<body>
  <header>
    <h1>Tafiq</h1>
    <button id="new" title="Start a new conversation">New chat</button>
    <button id="settings">Settings</button>
  </header>
  <div id="log" class="log">
    <p class="empty" id="empty">Type a request, tap 🎤, or say “Hey Tafiq”.</p>
  </div>
  <form id="form">
    <button type="button" id="mic" title="Talk (Alt+Shift+T)">🎤</button>
    <input id="input" placeholder="Ask Tafiq anything…" autocomplete="off">
    <button class="primary" type="submit">Send</button>
  </form>
  <script type="module" src="panel.js"></script>
</body>
</html>
